<meta name="description" content="Directory of published study notes and guides.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--surface:#fff;--ink:#231b0e;--muted:#6b5f4b;--rule:#e6dcc8;--accent:#a35f00;
--display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;--body:"Source Serif 4",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16120b;--surface:#201a10;--ink:#f1e9da;--muted:#b3a78f;--rule:#3a3020;--accent:#f2b544;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);padding:0 max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto}
header{padding:56px 0 28px;border-bottom:1px solid var(--rule)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(40px,7vw,72px)/1.05 var(--display);letter-spacing:-.02em;margin:12px 0 0}
h1 span{color:var(--accent)}
.sec{padding:28px 0 6px}
h2{font:700 14px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.site{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-left:6px solid var(--accent);border-radius:10px;padding:18px 20px}
.site:hover,.site:focus-visible{border-color:var(--accent);outline:none}
.site .t{font:700 21px/1.2 var(--display)}
.site .s{font-size:15px;color:var(--muted)}
.site .u{font:400 13px/1.3 var(--mono);color:var(--accent);overflow-wrap:anywhere}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:clamp(72px,12vw,120px);height:auto;flex:none}
:root[data-skin="thingsdark"] .brand img{filter:brightness(1.9) saturate(1.1)}
@media (max-width:420px){.brand{gap:14px}}
footer{padding:36px 0 110px;color:var(--muted);font-size:14px}
</style></head><body><div class="wrap">
