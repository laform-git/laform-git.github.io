<noscript><div style="padding:20px;font-size:24px"><h1>Lección 17: La cámara que ve por ti</h1><p>La cámara de tu iPhone puede contarte qué hay frente a ti: escenas, personas, objetos y letras.</p><p>Con VoiceOver encendido, toca tres veces con cuatro dedos. Así empieza el reconocimiento en vivo.</p><p>Apunta la cámara de atrás hacia algo y mueve el iPhone despacio. VoiceOver te dice lo que ve.</p><p>Para terminar, otra vez: tres toques con cuatro dedos.</p><p>La app Lupa también describe lo que ve y lee letras en voz alta, como una etiqueta o un letrero.</p><p>Muy importante: la cámara a veces se equivoca. Úsala para conocer cosas, nunca para cruzar la calle ni para caminar por lugares nuevos.</p><p>Practica con la cámara en el patio por la mañana. Aprendes algo nuevo y tomas la luz del día.</p><p>Seis preguntas. Una es de encontrar una app.</p><p>Tres toques con cuatro dedos encienden el reconocimiento en vivo.</p><p>La cámara siempre acierta.</p><p>Encuentra la app que describe lo que ve y lee letras.</p><p>Puedes usar la cámara para cruzar la calle sola.</p><p>Hay que mover el iPhone despacio para que la cámara entienda.</p><p>La luz de la mañana es buena para tu cuerpo.</p><p>Con mamá en la cocina: enciende el reconocimiento en vivo y descubre tres cosas. Después usa la Lupa para que te lea la etiqueta de una caja o de una lata.</p></div></noscript>
