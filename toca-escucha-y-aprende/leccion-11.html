<noscript><div style="padding:20px;font-size:24px"><h1>Lección 11: Escribe con tu voz y con tus dedos</h1><p>Hay dos maneras de escribir en tu iPhone: con tu voz y con tus dedos.</p><p>Con tu voz se llama dictado. Cuando aparezca el teclado, toca dos veces con dos dedos sobre él. Oyes un sonido: habla. Otra vez dos toques con dos dedos, y el iPhone escribe lo que dijiste.</p><p>Con tus dedos: el teclado está en la parte de abajo de la pantalla. Pon un dedo y arrástralo. VoiceOver te dice cada letra.</p><p>Cuando oigas la letra que quieres, levanta el dedo. La letra se escribe. Si no es la que quieres, sigue arrastrando sin levantar.</p><p>Las letras están siempre en el mismo lugar. La Q está arriba a la izquierda. La P, arriba a la derecha. El espacio, abajo en medio.</p><p>Si te equivocas, busca la tecla que borra. Está del lado derecho, arriba de la última fila. VoiceOver dice «Suprimir».</p><p>En la app Mensajes, escribe tu mensaje y busca el botón Enviar. Dos toques, y se va.</p><p>Escribir cansa los dedos y los hombros. Sacude las manos como si tuvieran agua, y abre y cierra los dedos cinco veces.</p><p>Seis preguntas. La última es de repaso de la música.</p><p>Dictar es escribir con tu voz.</p><p>Para empezar a dictar tocas dos veces con dos dedos sobre el teclado.</p><p>Cuando escribes con un dedo, la letra se escribe al levantar el dedo.</p><p>Las letras del teclado cambian de lugar todos los días.</p><p>Encuentra la tecla que borra.</p><p>Dos toques con dos dedos también detienen la música.</p><p>Abre Mensajes y escríbele a mamá. Primero dicta: «Hola, mamá». Después escribe con tus dedos una sola palabra: tu comida favorita. Envía el mensaje.</p></div></noscript>
