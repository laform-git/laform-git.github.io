<noscript><div style="padding:20px;font-size:24px"><h1>Lección 18: Escribe en braille</h1><p>Tú ya sabes braille. Hoy aprendes a escribirlo en la pantalla de tu iPhone, sin papel y sin máquina.</p><p>La pantalla se convierte en una celda de seis puntos. Cada dedo es un punto.</p><p>Primero entra a un lugar para escribir, como un mensaje nuevo. Luego gira el rotor hasta oír «Ingreso de Braille».</p><p>Pon el iPhone en la mesa, con la pantalla hacia arriba. Tres dedos de la mano izquierda son los puntos 1, 2 y 3. Tres de la derecha, los puntos 4, 5 y 6.</p><p>Para una letra, toca todos sus puntos al mismo tiempo, como un acorde. La a es solo el punto 1.</p><p>Espacio: desliza un dedo a la derecha. Borrar: un dedo a la izquierda. Nueva línea: dos dedos a la derecha.</p><p>En Mensajes, desliza tres dedos hacia arriba para enviar. Para salir del braille, haz el gesto de la goma con dos dedos.</p><p>Antes de escribir, calienta las manos: abre y cierra los dedos diez veces, y sacude las manos.</p><p>Seis preguntas. Dos son de encontrar un gesto.</p><p>Para escribir braille en la pantalla giras el rotor hasta «Ingreso de Braille».</p><p>Cada dedo es un punto de la celda.</p><p>Para una letra tocas sus puntos uno por uno, despacio.</p><p>Encuentra el gesto para poner un espacio.</p><p>Deslizar un dedo a la izquierda borra.</p><p>Encuentra el gesto para enviar un mensaje.</p><p>Abre un mensaje nuevo para mamá. Escribe en braille: hola mamá. Envíalo deslizando tres dedos hacia arriba.</p></div></noscript>
