<noscript><div style="padding:20px;font-size:24px"><h1>Lección 6: Practicamos juntas</h1><p>Encuentra los cuatro botones de tu iPhone y di el nombre de cada uno en voz alta.</p><p>Sube el volumen hasta que la voz de VoiceOver se oiga cómoda.</p><p>Ve a la pantalla de inicio deslizando un dedo desde abajo hasta sentir la vibración.</p><p>Di «Oye Siri, ¿cuánta batería tengo?» y cuéntale a mamá la respuesta.</p><p>Di «Oye Siri, mándale un mensaje a mamá». Cuando Siri pregunte qué dice, contesta: «Ya terminé mi misión».</p><p>Apaga VoiceOver con tres clics, préstale el teléfono a mamá, y cuando te lo regrese, enciéndelo otra vez.</p><p>Preguntas de todo el nivel. Unas son de cierto o falso y otras de encontrar un botón.</p><p>Deslizar un dedo a la derecha te lleva a lo siguiente.</p><p>Encuentra el botón Volumen.</p><p>Para presionar un botón con VoiceOver lo tocas una sola vez.</p><p>Un toque con dos dedos hace que VoiceOver se calle.</p><p>Encuentra el botón Botón lateral.</p><p>Enséñale a mamá un gesto de VoiceOver que ella no sepa. Explícale cómo se hace, sin tocar su mano.</p></div></noscript>
