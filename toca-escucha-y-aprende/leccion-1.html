<noscript><div style="padding:20px;font-size:24px"><h1>Lección 1: ¿Qué es la accesibilidad?</h1><p>¡Hola! Hoy vas a aprender una palabra nueva: accesibilidad.</p><p>Quiere decir que todas las personas pueden usar las cosas, cada quien a su manera.</p><p>Tú conoces el mundo con tus oídos y con tus manos. Tu iPhone está hecho para trabajar así contigo.</p><p>Cuando tocas la pantalla, VoiceOver te dice en voz alta qué hay ahí. No necesitas verla.</p><p>Y si le hablas a Siri, te escucha. Le puedes pedir que llame a mamá o que te diga la hora.</p><p>Tu cuerpo también tiene un reloj. Cada mañana, sal unos minutos al sol con mamá. La luz de la mañana le dice a tu cuerpo que ya es de día, y en la noche duermes mejor.</p><p>Te digo una frase sobre tu iPhone. Tú eliges: Cierto o Falso.</p><p>VoiceOver te dice en voz alta lo que tocas en la pantalla.</p><p>Para usar un iPhone necesitas ver la pantalla.</p><p>Siri puede llamar a mamá si se lo pides.</p><p>Las herramientas de accesibilidad hay que comprarlas aparte.</p><p>Puedes encontrar los botones del iPhone con los dedos.</p><p>La luz de la mañana te ayuda a dormir mejor en la noche.</p><p>Toma tu iPhone. Busca con los dedos los botones de los lados. Cuéntale a mamá cuántos encontraste y para qué crees que sirve cada uno.</p></div></noscript>
