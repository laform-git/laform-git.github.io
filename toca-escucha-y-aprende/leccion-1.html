<!doctype html><html lang="es-MX"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lección 1 · Toca, escucha y aprende</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Página para ella. Una pantalla a la vez: nada se desplaza, ningún párrafo se corta.
   Menú con tres burbujas grandes. Cada párrafo es su propia pantalla, con Atrás / Siguiente abajo. */
:root{color-scheme:light;--fg:#14213d;--muted:#4a5568;--line:#e2e8f0;--sky:#1d4ed8;--sky-bg:#e8efff;--sun:#ffd23f;--sun-ink:#5c4400;--org:#F97316;
  --ok:#0f7a4a;--ok-bg:#e6f6ee;--no:#b42318;--no-bg:#fdecea;--font:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#fff;color:var(--fg);font-family:var(--font);line-height:1.4}
button,a{font-family:var(--font)}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex="-1"]:focus{outline:4px solid var(--sky);outline-offset:4px}
[tabindex="-1"]:focus:not(:focus-visible){outline:none}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.screen[hidden]{display:none}
.top{font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:0 auto}
h1{font-size:clamp(30px,8vw,42px);line-height:1.1;margin:0 0 6px}
.sub{font-size:clamp(20px,5vw,24px);color:var(--muted);margin:0 0 22px}
h2{font-size:clamp(30px,7.6vw,40px);margin:0 0 12px;color:var(--sky)}
p.big{font-size:clamp(30px,7.8vw,40px);line-height:1.35;margin:0}

/* Menú: tres burbujas */
.bubbles{display:grid;gap:16px}
.bubble{display:flex;align-items:center;gap:18px;min-height:clamp(96px,17vh,140px);border:none;border-radius:999px;padding:0 28px;font-size:clamp(30px,8vw,40px);font-weight:700;text-align:left;color:#fff}
.bubble .n{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px}
.b1{background:var(--sky)}.b1 .n{color:var(--sky)}
.b2{background:var(--ok)}.b2 .n{color:var(--ok)}
.b3{background:#7a3fb8}.b3 .n{color:#7a3fb8}
.parents{margin-top:22px;font-size:20px;font-weight:700;color:var(--sky);text-align:center;display:block;padding:14px}

/* Barra de abajo */
.bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;width:100%;margin:12px auto 0}
.bar button{min-height:84px;border-radius:22px;font-size:clamp(24px,6.4vw,30px);font-weight:700;border:4px solid var(--org);background:#fff;color:#9a3d06}
.bar button.go{background:var(--org);color:#fff}
.bar #again{grid-column:1/-1}
.bar .home{grid-column:1/-1;min-height:64px;font-size:22px;border-color:var(--line);color:var(--fg)}

/* Juego */
.q{font-size:clamp(27px,7vw,34px);line-height:1.35;margin:0 0 18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.answers button{min-height:clamp(100px,16vh,130px);border-radius:24px;font-size:34px;font-weight:700;border:4px solid}
.yes{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.nope{background:var(--no-bg);color:var(--no);border-color:var(--no)}
.answers button:disabled{opacity:.5}
.answers[hidden]{display:none}
.fb{font-size:clamp(23px,6vw,28px);font-weight:700;min-height:1.4em;margin:16px 0 0}
.stars{font-size:34px;letter-spacing:6px;margin:6px 0 0;min-height:1.2em}
@media (max-height:620px){h2{font-size:28px;margin-bottom:8px}.top{font-size:15px}.bar{gap:8px;margin-top:8px}.bar button{min-height:64px;font-size:22px}.bar .home{min-height:52px;font-size:19px}.fb{font-size:21px;margin-top:10px}.stars{font-size:26px}p.big{font-size:clamp(26px,7vw,34px)}}
</style></head><body>

<!-- MENÚ -->
<section class="screen" id="s-menu" aria-labelledby="t-menu">
  <div class="body">
    <h1 id="t-menu" tabindex="-1">Lección 1: ¿Qué es la accesibilidad?</h1>
    <p class="sub">Elige una burbuja.</p>
    <div class="bubbles">
      <button type="button" class="bubble b1" data-go="historia-1"><span class="n" aria-hidden="true">1</span>Historia</button>
      <button type="button" class="bubble b2" data-go="juego"><span class="n" aria-hidden="true">2</span>Juego</button>
      <button type="button" class="bubble b3" data-go="reto"><span class="n" aria-hidden="true">3</span>Reto</button>
    </div>
    <a class="parents" href="leccion-1-padres.html">Notas para mamá</a>
  </div>
</section>

<!-- HISTORIA: una pantalla por párrafo (se llena desde el script) -->
<section class="screen" id="s-historia" aria-labelledby="t-historia" hidden>
  <p class="top" id="h-count"></p>
  <div class="body">
    <h2 id="t-historia">Historia</h2>
    <p class="big" id="h-text" tabindex="-1"></p>
  </div>
  <div class="bar">
    <button type="button" id="h-back">Atrás</button>
    <button type="button" class="go" id="h-next">Siguiente</button>
    <button type="button" class="home" data-go="menu">Volver al menú</button>
  </div>
</section>

<!-- JUEGO -->
<section class="screen" id="s-juego" aria-labelledby="t-juego" hidden>
  <p class="top" id="j-count"></p>
  <div class="body">
    <h2 id="t-juego">Juego: ¿cierto o falso?</h2>
    <p class="q" id="q" tabindex="-1"></p>
    <div class="answers" id="answers">
      <button type="button" class="yes" id="a-yes">Cierto</button>
      <button type="button" class="nope" id="a-no">Falso</button>
    </div>
    <p class="fb" id="fb" role="status" aria-live="polite"></p>
    <p class="stars" id="stars" aria-hidden="true"></p>
  </div>
  <div class="bar">
    <button type="button" id="again" hidden>Jugar otra vez</button>
    <button type="button" class="home" data-go="menu">Volver al menú</button>
  </div>
</section>

<!-- RETO -->
<section class="screen" id="s-reto" aria-labelledby="t-reto" hidden>
  <div class="body">
    <h2 id="t-reto">Tu reto de hoy</h2>
    <p class="big" id="r-text" tabindex="-1">Toma tu iPhone. Busca con los dedos los botones de los lados. Cuéntale a mamá cuántos encontraste y para qué crees que sirve cada uno.</p>
  </div>
  <div class="bar">
    <button type="button" class="home" data-go="menu">Volver al menú</button>
  </div>
</section>

<script>
(function(){
  var historia=[
    '¡Hola! Hoy vas a aprender una palabra nueva: accesibilidad.',
    'Quiere decir que todas las personas pueden usar las cosas, cada quien a su manera.',
    'Tú conoces el mundo con tus oídos y con tus manos. Tu iPhone está hecho para trabajar así contigo.',
    'Cuando tocas la pantalla, VoiceOver te dice en voz alta qué hay ahí. No necesitas verla.',
    'Y si le hablas a Siri, te escucha. Le puedes pedir que llame a mamá o que te diga la hora.'
  ];
  var screens=['menu','historia','juego','reto'];
  function $(id){return document.getElementById(id)}

  // Mostrar una pantalla y poner el foco donde VoiceOver debe empezar a leer
  function show(route){
    var m=/^historia-(\d+)$/.exec(route), name=m?'historia':route;
    if(screens.indexOf(name)<0){ name='menu'; route='menu'; }
    screens.forEach(function(s){ $('s-'+s).hidden=(s!==name); });
    var focusEl;
    if(name==='historia'){
      var n=Math.min(Math.max(parseInt(m[1],10)||1,1),historia.length);
      $('h-count').textContent='Historia · '+n+' de '+historia.length;
      $('h-text').textContent=historia[n-1];
      $('h-back').textContent=n===1?'Menú':'Atrás';
      $('h-next').textContent=n===historia.length?'Terminar':'Siguiente';
      $('h-back').dataset.go=n===1?'menu':'historia-'+(n-1);
      $('h-next').dataset.go=n===historia.length?'menu':'historia-'+(n+1);
      focusEl=$('h-text');
    } else if(name==='juego'){ focusEl=$('q'); }
    else if(name==='reto'){ focusEl=$('r-text'); }
    else { focusEl=$('t-menu'); }
    setTimeout(function(){ focusEl.focus(); },60);
  }
  function go(route){ if(location.hash==='#'+route) show(route); else location.hash=route; }
  window.addEventListener('hashchange',function(){ show(location.hash.slice(1)); });
  document.addEventListener('click',function(e){ var b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(b.dataset.go); } });

  // Juego: cierto o falso sobre el iPhone
  var items=[
    ['VoiceOver te dice en voz alta lo que tocas en la pantalla.',true,'¡Cierto! Por eso puedes usar el iPhone sin verlo.'],
    ['Para usar un iPhone necesitas ver la pantalla.',false,'¡Bien! Es falso. Con VoiceOver y Siri lo usas con tus oídos y tus dedos.'],
    ['Siri puede llamar a mamá si se lo pides.',true,'¡Cierto! Solo dile: Oye Siri, llama a mamá.'],
    ['Las herramientas de accesibilidad hay que comprarlas aparte.',false,'¡Bien! Es falso. Ya vienen dentro de tu iPhone, en Configuración.'],
    ['Puedes encontrar los botones del iPhone con los dedos.',true,'¡Cierto! Están en los lados, y cada uno tiene su lugar.']
  ], i=0, stars=0;
  var yes=$('a-yes'), no=$('a-no'), q=$('q'), fb=$('fb'), again=$('again');
  function ask(){ $('j-count').textContent='Pregunta '+(i+1)+' de '+items.length; q.textContent=items[i][0]; yes.disabled=no.disabled=false; }
  function answer(v){
    if(yes.disabled) return; yes.disabled=no.disabled=true;
    var it=items[i], right=(v===it[1]); if(right){ stars++; $('stars').textContent='⭐'.repeat(stars); }
    var msg=right?it[2]:'Casi. Es '+(it[1]?'cierto. ':'falso. ')+it[2].replace(/^¡[^!]*! (Es falso\. )?/,'');
    i++;
    if(i<items.length){ ask(); fb.textContent=msg+' Siguiente pregunta: '+q.textContent; }
    else { $('j-count').textContent='Fin del juego'; q.textContent='¡Terminaste! Ganaste '+stars+' de '+items.length+' estrellas.'; fb.textContent=msg; $('answers').hidden=true; again.hidden=false; setTimeout(function(){q.focus()},60); }
  }
  yes.addEventListener('click',function(){answer(true)});
  no.addEventListener('click',function(){answer(false)});
  again.addEventListener('click',function(){ i=0; stars=0; $('stars').textContent=''; again.hidden=true; $('answers').hidden=false; ask(); fb.textContent=''; setTimeout(function(){q.focus()},60); });
  ask();

  show(location.hash.slice(1)||'menu');
})();
</script>
</body></html>
