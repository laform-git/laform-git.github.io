<noscript><div style="padding:20px;font-size:24px"><h1>Lección 4: Conoce a VoiceOver</h1><p>VoiceOver es la voz de tu iPhone. Lee en voz alta lo que tocas.</p><p>Toca la pantalla con un dedo y VoiceOver te dice qué hay ahí. Puedes arrastrar el dedo para explorar sin abrir nada.</p><p>Desliza un dedo a la derecha para ir a lo siguiente. A la izquierda, para regresar. Así recorres todo en orden.</p><p>Toca dos veces rápido en cualquier parte de la pantalla para presionar lo último que VoiceOver dijo.</p><p>Toca una vez con dos dedos para que VoiceOver se calle. Otra vez con dos dedos, y sigue hablando.</p><p>Para ir a la pantalla de inicio, pon un dedo en el borde de abajo y deslízalo hacia arriba hasta sentir una vibración. Luego suelta.</p><p>Para prestarle el teléfono a mamá, aprieta tres veces el botón lateral: VoiceOver se apaga. Cuando te lo regrese, otra vez tres veces.</p><p>Dormir bien te ayuda a aprender. A tu edad necesitas entre 9 y 12 horas de sueño. Una hora antes de dormir, deja el iPhone cargando lejos de tu cama.</p><p>Hay varios botones en la pantalla. Desliza a la derecha para escucharlos y toca dos veces el que te pido.</p><p>Encuentra el botón Estrella.</p><p>Encuentra el botón Perro.</p><p>Encuentra el botón Pastel.</p><p>Encuentra el botón Guitarra.</p><p>Ahora arrastra un dedo por la pantalla hasta oír Mariposa. Luego toca dos veces.</p><p>Ve a la pantalla de inicio deslizando desde abajo. Busca la app Reloj, ábrela con dos toques y escucha qué hay. Después regresa a la pantalla de inicio. ¡Sin ayuda!</p></div></noscript>
