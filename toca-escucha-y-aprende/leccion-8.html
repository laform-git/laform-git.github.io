<noscript><div style="padding:20px;font-size:24px"><h1>Lección 8: El rotor: tu perilla invisible</h1><p>Toma un frasco y gira la tapa con dos dedos. El rotor de VoiceOver se usa igual: es una perilla invisible en la pantalla.</p><p>Pon dos dedos en la pantalla, un poco separados, y gíralos como si giraras la tapa. VoiceOver dice una palabra. Esa es una opción del rotor.</p><p>Sigue girando y oyes más opciones: Caracteres, Palabras, Velocidad de habla, Volumen.</p><p>Cuando oigas la que quieres, deja de girar. Ahora desliza un dedo hacia arriba o hacia abajo para usarla.</p><p>Un ejemplo. Gira hasta oír «Velocidad de habla». Desliza hacia arriba y VoiceOver habla más rápido. Hacia abajo, más lento.</p><p>Otro ejemplo. Gira hasta oír «Caracteres». Desliza hacia abajo y VoiceOver te lee letra por letra. Sirve para saber cómo se escribe una palabra.</p><p>El rotor se queda donde lo dejaste. Si VoiceOver hace algo raro cuando deslizas hacia arriba o hacia abajo, gira el rotor y escucha en qué opción está.</p><p>Toma agua. Tu cuerpo y tu cerebro trabajan mejor con agua. Deja un vaso cerca cuando hagas tu lección.</p><p>Seis preguntas. Las dos últimas son de repaso de la lección 7.</p><p>El rotor se usa girando dos dedos en la pantalla.</p><p>Después de elegir una opción del rotor, deslizas un dedo hacia arriba o hacia abajo para usarla.</p><p>Con el rotor en Velocidad de habla, deslizar hacia arriba hace que VoiceOver hable más lento.</p><p>Encuentra la opción del rotor que lee letra por letra.</p><p>Deslizar tres dedos hacia arriba pasa la página.</p><p>Para regresar a la pantalla anterior aprietas tres veces el botón lateral.</p><p>Gira el rotor hasta oír «Velocidad de habla». Sube la velocidad dos veces y bájala una. Luego gira hasta «Caracteres», toca una app en la pantalla de inicio y pídele a VoiceOver que te deletree su nombre.</p></div></noscript>
