<noscript><div style="padding:20px;font-size:24px"><h1>Lección 9: Tu música</h1><p>Puedes pedir música con tu voz. Di: «Oye Siri, pon música para bailar». O di el nombre de una canción, o de quien la canta.</p><p>Para detener la música hay un gesto especial: toca dos veces con dos dedos, en cualquier parte de la pantalla. Otra vez, y la música sigue.</p><p>Ese mismo gesto contesta una llamada. Y también la cuelga.</p><p>También lo puedes pedir con la voz. «Siri, pausa». «Oye Siri, sáltate esta canción». «Oye Siri, sube el volumen».</p><p>Si oyes una canción que te gusta y no sabes cuál es, pregunta: «Oye Siri, ¿cómo se llama esta canción?».</p><p>En la app Música hay botones como los que ya conoces. Desliza a la derecha para encontrarlos: Anterior, Pausa, Siguiente. Dos toques para presionar.</p><p>Cantar y bailar mueven todo tu cuerpo y te ponen de buen humor. Pon una canción y baila con alguien de tu familia.</p><p>Seis preguntas. Una es de repaso del rotor.</p><p>Tocar dos veces con dos dedos detiene la música.</p><p>Para pedir una canción tienes que escribir su nombre.</p><p>Siri puede decirte cómo se llama la canción que está sonando.</p><p>Encuentra el botón que detiene la música.</p><p>El rotor se usa girando dos dedos en la pantalla.</p><p>Escuchar música muy fuerte por mucho tiempo puede lastimar tus oídos.</p><p>Pídele a Siri una canción que te guste. Detenla con dos toques de dos dedos. Hazla seguir. Luego pídele a Siri que suba el volumen, y después que lo baje.</p></div></noscript>
