<noscript><div style="padding:20px;font-size:24px"><h1>Lección 16: Tu VoiceOver a tu manera</h1><p>VoiceOver se puede ajustar a tu gusto: más rápido o más lento, con otra voz, o que hable más o menos.</p><p>La velocidad ya la conoces: gira el rotor hasta «Velocidad de habla» y desliza un dedo hacia arriba o hacia abajo.</p><p>Para cambiar la voz: abre Configuración, Accesibilidad, VoiceOver, y busca Voz. Ahí puedes probar voces en español.</p><p>Algunas voces dicen «Mejorada» o «Premium». Suenan más naturales, pero hay que descargarlas. Pídele permiso a mamá.</p><p>La verbosidad es cuánto habla VoiceOver. Con las indicaciones encendidas, te dice qué puedes hacer con cada botón.</p><p>Cortina de pantalla: toca tres veces con tres dedos y la pantalla se pone negra. VoiceOver sigue funcionando y nadie ve lo que haces.</p><p>Tus oídos también descansan. Después de un buen rato escuchando, quédate unos minutos sin audífonos y sin voz.</p><p>Seis preguntas. Una es de encontrar un ajuste.</p><p>Con el rotor puedes hacer que VoiceOver hable más rápido.</p><p>Todas las voces ya vienen descargadas.</p><p>Encuentra el ajuste de la rapidez de la voz.</p><p>Con la cortina de pantalla, la pantalla se pone negra pero VoiceOver sigue funcionando.</p><p>Para la cortina de pantalla tocas tres veces con tres dedos.</p><p>Las indicaciones te dicen qué puedes hacer con cada botón.</p><p>Con mamá: prueba tres voces en español y elige tu favorita. Después pon la cortina de pantalla, abre una app y quita la cortina otra vez.</p></div></noscript>
