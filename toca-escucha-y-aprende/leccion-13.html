<noscript><div style="padding:20px;font-size:24px"><h1>Lección 13: Tu seguridad</h1><p>Tu iPhone te puede ayudar si algún día necesitas ayuda de verdad. Hoy aprendes tres cosas de seguridad.</p><p>La llamada de emergencia: deja apretados al mismo tiempo el botón lateral y un botón de volumen. El iPhone cuenta hacia atrás y llama al 911.</p><p>Solo es para una emergencia de verdad: si alguien está herido, si hay fuego o si estás en peligro. Si la activas sin querer, suelta los botones antes de que termine la cuenta.</p><p>Cuando termina una llamada de emergencia, tu iPhone le manda un mensaje a mamá con tu ubicación.</p><p>Con la app Encontrar, mamá puede saber dónde estás. No es para espiarte: es para que siempre te pueda encontrar.</p><p>Tu ficha médica guarda tus datos de salud y el número de mamá. Si algún día no puedes hablar, quien te ayude la puede ver.</p><p>Cuidarte también es estar lista. Antes de salir, pregúntale a Siri cuánta batería tienes. Si queda poca, carga tu iPhone.</p><p>Seis preguntas. Una es de encontrar un número.</p><p>La llamada de emergencia es solo para un peligro de verdad.</p><p>Para llamar a emergencias aprietas juntos el botón lateral y un botón de volumen.</p><p>Encuentra el número de emergencias en México.</p><p>Si la activas sin querer, puedes soltar los botones antes de que termine la cuenta.</p><p>Mamá puede ver dónde estás para espiarte.</p><p>Tu ficha médica nadie la puede ver nunca.</p><p>Con mamá, sin llamar: pon un dedo en el botón lateral y otro en un botón de volumen. ¡No aprietes! Solo aprende dónde van. Después dile a mamá su número de teléfono de memoria.</p></div></noscript>
