<noscript><div style="padding:20px;font-size:24px"><h1>Lección 14: Llamadas y FaceTime</h1><p>Hoy aprendes a contestar y a colgar llamadas, y a hacer videollamadas con FaceTime.</p><p>Cuando suena tu iPhone, VoiceOver te dice quién llama. Para contestar, toca dos veces con dos dedos.</p><p>Para colgar, el mismo gesto: dos toques con dos dedos. Es el gesto que también pausa la música.</p><p>Para llamar, dile a Siri: «Llama a mamá». También puedes abrir la app Teléfono y buscar el contacto.</p><p>FaceTime es una llamada con video: la otra persona te ve. Di «Oye Siri, haz una llamada de FaceTime a mamá».</p><p>En FaceTime, sostén el iPhone frente a tu cara, a la altura de tus ojos. Si no sabes si se te ve bien, pregunta: «¿Me ves bien?»</p><p>Platicar con quien quieres te pone de buen humor. Esta semana llama a alguien de tu familia, solo para platicar.</p><p>Seis preguntas. Una es de encontrar una app.</p><p>Para contestar una llamada tocas dos veces con dos dedos.</p><p>Contestar y colgar usan el mismo gesto.</p><p>Encuentra la app de las videollamadas.</p><p>En FaceTime la otra persona te puede ver.</p><p>Para una videollamada, el iPhone va en la mesa, lejos de tu cara.</p><p>VoiceOver te dice quién te llama, si está en tus contactos.</p><p>Pídele a mamá que te llame. Contesta con dos toques de dos dedos, platiquen un momento y cuelga tú. Después haz una llamada de FaceTime a mamá con Siri.</p></div></noscript>
