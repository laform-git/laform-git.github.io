<noscript><div style="padding:20px;font-size:24px"><h1>Lección 15: Avisos y botones rápidos</h1><p>Tu iPhone tiene dos lugares escondidos: el Centro de notificaciones y el Centro de control.</p><p>Las notificaciones son avisos: un mensaje nuevo, una alarma, un recordatorio. Se juntan en el Centro de notificaciones.</p><p>Para abrirlo: toca la parte de arriba de la pantalla, donde está la hora. Luego desliza tres dedos hacia abajo.</p><p>Desliza a la derecha para oír cada aviso. Para cerrar, haz el gesto de la goma: dos dedos de un lado a otro.</p><p>El Centro de control tiene botones rápidos: el volumen, la linterna, el modo avión y No molestar.</p><p>Para abrirlo: toca arriba, donde está la hora. Luego desliza tres dedos hacia arriba desde la parte de abajo.</p><p>Los avisos en la noche no te dejan descansar. Antes de dormir, abre el Centro de control y activa No molestar.</p><p>Seis preguntas. Una es de encontrar un botón.</p><p>Los avisos de mensajes nuevos se juntan en el Centro de notificaciones.</p><p>Para abrir el Centro de notificaciones tocas donde está la hora y deslizas tres dedos hacia abajo.</p><p>Encuentra el botón que prende la linterna.</p><p>No molestar hace que el iPhone no te interrumpa con avisos.</p><p>El modo avión sirve para hacer llamadas más rápido.</p><p>Para cerrar el Centro de notificaciones usas el gesto de la goma.</p><p>Abre el Centro de notificaciones y escucha tus avisos. Ciérralo con la goma. Después abre el Centro de control, busca No molestar y escucha si está activado. ¡No cambies nada más!</p></div></noscript>
