<noscript><div style="padding:20px;font-size:24px"><h1>Lección 10: Cuentos y podcasts</h1><p>Un podcast es un programa para escuchar. Hay de cuentos, de ciencia y de música. Escucharlos es gratis.</p><p>Cada podcast tiene muchos capítulos. Se llaman episodios.</p><p>Para oír uno, di «Oye Siri, pon el podcast» y luego su nombre. Por ejemplo: «Oye Siri, pon el podcast Cuentos Increíbles».</p><p>Se detiene igual que la música: dos toques con dos dedos. Otra vez, y sigue.</p><p>En la app Podcasts, cada episodio es un botón. Desliza a la derecha para oír los nombres y da dos toques en el que quieras.</p><p>Hay listas largas con muchos episodios. Ya sabes qué hacer: tres dedos hacia arriba para pasar la página.</p><p>Si un podcast te gusta, lo puedes seguir. Así los episodios nuevos te llegan solos. Pídele a mamá que te ayude la primera vez.</p><p>Escuchar un cuento es un buen descanso. Acuéstate en un sillón o en el piso y solo escucha. Y recuerda: una hora antes de dormir, el iPhone se queda cargando lejos de tu cama.</p><p>Seis preguntas. Una es de repaso de la lección 7.</p><p>Un podcast es un programa para escuchar.</p><p>Los capítulos de un podcast se llaman episodios.</p><p>Para detener un podcast hay que apagar el iPhone.</p><p>Encuentra el podcast de cuentos.</p><p>Siri puede poner un podcast si le dices su nombre.</p><p>Para pasar la página de una lista larga deslizas tres dedos hacia arriba.</p><p>Con mamá, elige un podcast. Pídeselo a Siri. Escucha un episodio completo y después cuéntale a alguien de tu familia de qué trató.</p></div></noscript>
