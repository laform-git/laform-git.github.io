<noscript><div style="padding:20px;font-size:24px"><h1>Lección 12: Apps que te ayudan</h1><p>Tu iPhone tiene una cámara. Con ayuda de una app, la cámara te puede decir qué hay enfrente.</p><p>Seeing AI es una app gratis. Le apuntas a una hoja y te lee el texto en voz alta. También describe fotos y te dice de qué color es algo.</p><p>Para que la cámara vea bien, pon el iPhone sobre lo que quieres leer y levántalo despacio, como un elevador. Mantenlo derechito.</p><p>Be My Eyes te conecta con una persona voluntaria. Ella ve por tu cámara y te dice lo que hay. Es una app para personas adultas, así que se usa con mamá, desde su cuenta.</p><p>Lazarillo es como un guía en la calle. Cuando caminas con tu familia, te dice en voz alta por dónde vas y qué lugares hay cerca.</p><p>Las apps ayudan mucho, pero a veces se equivocan. Si algo es importante, como una medicina, pregúntale siempre a una persona adulta.</p><p>Antes de bajar una app nueva, pregúntale a mamá. Ella revisa que funcione bien con VoiceOver.</p><p>Lo más divertido no está en el teléfono. Hoy, después de tu lección, sal a jugar: toca un árbol, escucha a los pájaros, corre con alguien de la mano.</p><p>Abre Configuración y haz que VoiceOver lea toda la pantalla, con dos dedos hacia arriba.</p><p>Gira el rotor hasta «Velocidad de habla» y deja la voz a la velocidad que más te guste.</p><p>Pídele a Siri tu canción favorita. Detenla con dos toques de dos dedos.</p><p>Pon un episodio de tu podcast favorito y escúchalo acostada, con los ojos cerrados.</p><p>Mándale a mamá un mensaje dictado que diga: «Ya terminé el Nivel 2».</p><p>Con mamá, abre Seeing AI y pídele que lea la portada de un libro o una caja de la cocina.</p><p>Seis preguntas de todo el Nivel 2.</p><p>Seeing AI puede leer en voz alta el texto de una hoja.</p><p>Be My Eyes se usa con mamá, desde su cuenta.</p><p>Las apps que describen cosas nunca se equivocan.</p><p>Encuentra la app que te guía en la calle.</p><p>Para dictar tocas dos veces con dos dedos sobre el teclado.</p><p>El rotor se gira con un solo dedo.</p><p>Enséñale a alguien de tu familia tu gesto favorito del Nivel 2. Explícale cómo se hace y para qué sirve.</p></div></noscript>
