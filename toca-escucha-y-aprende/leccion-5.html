<noscript><div style="padding:20px;font-size:24px"><h1>Lección 5: Conoce a Siri</h1><p>Siri es la asistente de tu iPhone. Le hablas y hace cosas por ti.</p><p>Para llamarla, di «Oye Siri» y luego lo que quieres. También puedes dejar apretado el botón lateral y hablar.</p><p>Habla claro y normal, como con una persona. No tienes que gritar ni hablar despacio.</p><p>Siri te dice la hora, el clima o cuánta batería tienes. También pone alarmas, llama y manda mensajes.</p><p>Siri también ayuda con VoiceOver. Di «Oye Siri, desactiva VoiceOver» o «activa VoiceOver».</p><p>Si Siri no te entiende, no pasa nada. Dilo otra vez con otras palabras.</p><p>Seis frases sobre Siri.</p><p>Para hablar con Siri puedes decir «Oye Siri».</p><p>Tienes que gritar para que Siri te escuche.</p><p>Siri puede decirte cuánta batería tiene tu iPhone.</p><p>Siri puede apagar VoiceOver.</p><p>Si Siri no te entiende, el iPhone se descompone.</p><p>Puedes poner una alarma solo con la voz.</p><p>Tres cosas con Siri: pregúntale la hora, pregúntale qué tiempo hace hoy y pon una alarma en cinco minutos. Cuando suene, apágala tú.</p></div></noscript>
