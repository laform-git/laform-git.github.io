<noscript><div style="padding:20px;font-size:24px"><h1>Lección 7: Tres gestos nuevos</h1><p>Ya sabes tocar, deslizar y dar dos toques. Hoy aprendes tres gestos nuevos. Los tres usan más de un dedo.</p><p>El primero: leer todo. Desliza dos dedos hacia arriba y VoiceOver lee la pantalla completa, desde el principio. Tú solo escuchas.</p><p>Si quieres que se detenga, toca una vez con dos dedos. Ese gesto ya lo conoces.</p><p>El segundo: pasar la página. Hay pantallas largas que no caben completas. Desliza tres dedos hacia arriba para bajar una página. Tres dedos hacia abajo, y regresas.</p><p>En la pantalla de inicio, desliza tres dedos a la izquierda o a la derecha para cambiar de página de apps.</p><p>El tercero: regresar. Mueve dos dedos rápido de un lado a otro, tres veces, como si borraras con una goma. Así cierras lo que abriste o vuelves a la pantalla anterior.</p><p>Antes de probarlos en la pantalla, practica en la mesa: dos dedos juntos, luego tres dedos juntos. Suave, como cosquillas.</p><p>Tus oídos trabajan mucho con el iPhone. Mantén el volumen a la mitad o menos. Si no alcanzas a oír a quien te habla a tu lado, está muy fuerte.</p><p>Seis preguntas. Una es de encontrar un botón, y una es de repaso del Nivel 1.</p><p>Deslizar dos dedos hacia arriba hace que VoiceOver lea toda la pantalla.</p><p>Para pasar la página deslizas un solo dedo hacia arriba.</p><p>Mover dos dedos de un lado a otro, tres veces, te regresa a la pantalla anterior.</p><p>Encuentra el gesto que lee toda la pantalla.</p><p>Dos toques rápidos presionan lo último que VoiceOver dijo.</p><p>Si el volumen está tan fuerte que no oyes a quien te habla, hay que bajarlo.</p><p>Abre Configuración desde la pantalla de inicio. Desliza dos dedos hacia arriba para que VoiceOver lea todo. Luego pasa la página con tres dedos, dos veces. Al final, regresa a la pantalla de inicio.</p></div></noscript>
