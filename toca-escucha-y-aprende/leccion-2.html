<noscript><div style="padding:20px;font-size:24px"><h1>Lección 2: ¿Por qué iPhone?</h1><p>Hay muchos teléfonos. Los que usan Android también tienen un lector de pantalla. Se llama TalkBack.</p><p>En el iPhone, VoiceOver funciona igual en todos los modelos y en casi todas las apps. Lo que aprendas hoy te va a servir por muchos años.</p><p>VoiceOver y Siri ya vienen dentro de tu iPhone. No tienes que instalar nada.</p><p>Los gestos de VoiceOver son los mismos en todas las apps. Una app nueva solo tiene otros botones en otro lugar.</p><p>Muchas personas con discapacidad visual usan iPhone: estudiantes, maestros y hasta programadores. Si tienes una duda, hay mucha gente que te puede ayudar.</p><p>Tu cuerpo necesita moverse, igual que tu cerebro necesita aprender. Brinca, baila o pon tu canción favorita. Lo mejor es moverte un rato todos los días.</p><p>Seis frases más. Recuerda: si quieres oír otra vez una pantalla, usa Atrás.</p><p>Los teléfonos Android también tienen un lector de pantalla.</p><p>Para usar VoiceOver tienes que descargar una app.</p><p>VoiceOver funciona igual en todos los iPhone.</p><p>Cada app tiene sus propios gestos de VoiceOver.</p><p>Siri y VoiceOver pueden trabajar juntos.</p><p>Moverte un rato todos los días es bueno para tu cuerpo y para tu cerebro.</p><p>Con mamá cerca, di: «Oye Siri, ¿qué es VoiceOver?». Escucha la respuesta. Después cuéntale a mamá una cosa nueva que aprendiste hoy.</p></div></noscript>
