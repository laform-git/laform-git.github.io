<noscript><div style="padding:20px;font-size:24px"><h1>Lección 3: Conoce tu iPhone con las manos</h1><p>Toma tu iPhone con las dos manos. La pantalla es la parte lisa de vidrio. Atrás, en una esquina de arriba, sientes un círculo con relieve: es la cámara.</p><p>Así sabes cuál lado es arriba: la cámara de atrás queda arriba. El agujero para el cable queda abajo.</p><p>Del lado derecho hay un solo botón largo: el botón lateral. Enciende y apaga la pantalla.</p><p>Si aprietas el botón lateral tres veces rápido, VoiceOver se enciende o se apaga. Si lo dejas apretado, contesta Siri.</p><p>Del lado izquierdo hay tres botones. Los dos de abajo son el volumen: el de arriba sube y el de abajo baja.</p><p>El botón más pequeño, arriba de los de volumen, es el botón de Acción. Mamá puede elegir qué hace, por ejemplo poner el teléfono en silencio.</p><p>Abajo, en el centro, está el agujero ovalado para cargar. A los lados hay agujeritos: son las bocinas.</p><p>Después de un rato con el iPhone, ponlo en la mesa y estírate: brazos arriba, cuenta hasta diez, y gira los hombros. Tus manos y tu cuello también descansan.</p><p>Puedes tocar tu iPhone para comprobar cada respuesta.</p><p>El botón lateral está del lado derecho.</p><p>Para subir el volumen aprietas el botón de abajo del lado izquierdo.</p><p>Tres clics rápidos en el botón lateral encienden o apagan VoiceOver.</p><p>El cable para cargar se conecta arriba.</p><p>La cámara de atrás te ayuda a saber cuál lado es arriba.</p><p>Después de usar el iPhone un rato, es bueno levantarte y estirarte.</p><p>Sin ayuda: sube el volumen dos veces, bájalo una vez y apaga la pantalla con el botón lateral. Luego conecta el cable para cargar. Mamá solo escucha.</p></div></noscript>
