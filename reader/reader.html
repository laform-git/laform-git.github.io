<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>:root{--body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif}body{font-family:var(--body);font-size:19px;line-height:1.6}article.note{font-size:19px}article.note li{margin:6px 0}.site .s,.course .s,.chcard .s,.seccard p{font-size:17px}</style>
<div class="fsctl" role="group" aria-label="Reading tools"><button type="button" class="tts" aria-label="Read this page aloud">▶ Listen</button><button type="button" data-d="-1" aria-label="Smaller text">A−</button><button type="button" data-d="1" aria-label="Larger text">A+</button></div>
<style>.fsctl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:50}
.fsctl button{font:700 15px/1 var(--display);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:9px 12px;cursor:pointer;min-width:44px;min-height:40px;white-space:nowrap}
.fsctl button:hover,.fsctl button:focus-visible{background:var(--accent-soft,rgba(0,0,0,.06));outline:none}
.fsctl .tts.on{background:var(--accent);color:var(--surface)}</style>
<script>(function(){var s=[.85,1,1.15,1.3,1.5,1.75],i=1;try{var v=parseFloat(localStorage.getItem("fs"));if(s.indexOf(v)>-1)i=s.indexOf(v)}catch(e){}function a(){var w=document.querySelector(".wrap");if(w)w.style.zoom=s[i];try{localStorage.setItem("fs",s[i])}catch(e){}}a();document.querySelectorAll(".fsctl button[data-d]").forEach(function(b){b.addEventListener("click",function(){i=Math.max(0,Math.min(s.length-1,i+(+b.dataset.d)));a()})});
var t=document.querySelector(".fsctl .tts"),ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance){t.hidden=true;return}
var playing=false,q=[],n=0;
function voice(){var vs=ss.getVoices().filter(function(v){return /^en/i.test(v.lang)&&!/Siri/i.test(v.name)});var pr=[/Natural/i,/Online/i,/Premium/i,/Enhanced/i,/Google US English/i,/Ava|Zoe|Evan|Nathan|Samantha/i];for(var k=0;k<pr.length;k++){var m=vs.filter(function(v){return pr[k].test(v.name)})[0];if(m)return m}return null}
function stop(){playing=false;q=[];if(ss.speaking||ss.pending)ss.cancel();t.classList.remove("on");t.textContent="▶ Listen"}
function next(){if(!playing)return;if(n>=q.length){stop();return}var u=new SpeechSynthesisUtterance(q[n++]);u.lang="en-US";u.rate=1;var vb=voice();if(vb)u.voice=vb;u.onend=next;u.onerror=function(e){if(e.error==="interrupted"||e.error==="canceled")return;next()};ss.speak(u)}
function root(){var v=[].filter.call(document.querySelectorAll(".view"),function(x){return !x.hidden})[0]||document.querySelector(".wrap")||document.body;return v.querySelector("article")||v}
t.addEventListener("click",function(){if(playing){stop();return}
q=[].map.call(root().querySelectorAll("h1,h2,h3,h4,p,li,td,blockquote,.t,.s"),function(e){return e.innerText.replace(/[✅🟢🟡🔴🕯]/g,"").trim()}).filter(Boolean);
if(!q.length)return;if(ss.speaking||ss.pending)ss.cancel();if(ss.paused)ss.resume();playing=true;n=0;t.classList.add("on");t.textContent="■ Stop";next()});
window.addEventListener("hashchange",stop);window.addEventListener("pagehide",stop)})();</script>
