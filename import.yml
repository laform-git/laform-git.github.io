name: Import study sites
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy sites into the repo
        run: |
          mkdir -p bikman christianity-and-islam
          curl -fsSL https://why-we-get-sick-hub.netlify.app/ -o bikman/index.html
          curl -fsSL https://om-christianity-and-islam.netlify.app/ -o christianity-and-islam/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bikman christianity-and-islam
          git diff --cached --quiet || git commit -m "Import study sites"
          git push
